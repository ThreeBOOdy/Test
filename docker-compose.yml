services:
  db:
    image: mysql:8.0.46
    restart: unless-stopped
    command: ["--character-set-server=utf8mb4", "--collation-server=utf8mb4_0900_ai_ci"]
    environment:
      MYSQL_DATABASE: practice_dev
      MYSQL_USER: practice
      MYSQL_PASSWORD: practice
      MYSQL_ROOT_PASSWORD: root-practice
    ports:
      - "127.0.0.1:3306:3306"
    volumes:
      - practice-mysql:/var/lib/mysql
      - ./scripts/mysql-docker-init.sql:/docker-entrypoint-initdb.d/01-practice-databases.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "mysqladmin ping -h 127.0.0.1 -u root -p$$MYSQL_ROOT_PASSWORD --silent"]
      interval: 5s
      timeout: 5s
      retries: 30

  app:
    build: .
    restart: unless-stopped
    environment:
      DATABASE_URL: mysql://practice:practice@db:3306/practice_dev
      AUTH_SECRET: ${AUTH_SECRET}
      COOKIE_SECURE: "false"
      NODE_ENV: production
    ports:
      - "3000:3000"
    depends_on:
      db:
        condition: service_healthy

volumes:
  practice-mysql:
