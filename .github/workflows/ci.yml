name: CI

on:
  push:
  pull_request:

jobs:
  verify:
    runs-on: ubuntu-latest
    services:
      mysql:
        image: mysql:8.0.46
        env:
          MYSQL_DATABASE: practice_ci_integration
          MYSQL_USER: practice
          MYSQL_PASSWORD: practice
          MYSQL_ROOT_PASSWORD: root-practice
        ports:
          - 3306:3306
        options: >-
          --health-cmd "mysqladmin ping -h 127.0.0.1 -u root -proot-practice --silent"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 30
    env:
      DATABASE_URL: mysql://practice:practice@127.0.0.1:3306/practice_ci_integration
      AUTH_SECRET: ci-auth-secret-with-at-least-thirty-two-characters
      COOKIE_SECURE: "true"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm run db:generate
      - run: npm test
      - run: npx prisma db execute --file scripts/mysql-ci-init.sql
        env:
          DATABASE_URL: mysql://root:root-practice@127.0.0.1:3306/mysql
      - run: npx prisma migrate deploy
        env:
          DATABASE_URL: mysql://practice:practice@127.0.0.1:3306/practice_ci_integration
      - run: npm run test:integration
        env:
          DATABASE_URL: mysql://practice:practice@127.0.0.1:3306/practice_ci_integration
          COURSE_MIGRATION_DATABASE_URL: mysql://practice:practice@127.0.0.1:3306/practice_ci_migration
      - run: npm run lint
      - run: npm run build
      - run: npx playwright install --with-deps chromium
      - run: npx prisma migrate deploy
        env:
          DATABASE_URL: mysql://practice:practice@127.0.0.1:3306/practice_ci_e2e
      - run: npm run db:seed
        env:
          DATABASE_URL: mysql://practice:practice@127.0.0.1:3306/practice_ci_e2e
      - run: npm run test:e2e
        env:
          DATABASE_URL: mysql://practice:practice@127.0.0.1:3306/practice_ci_e2e
