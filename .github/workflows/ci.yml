name: CI

on:
  push:
  pull_request:

jobs:
  verify:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:18-alpine
        env:
          POSTGRES_DB: practice
          POSTGRES_USER: practice
          POSTGRES_PASSWORD: practice
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U practice -d practice"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 20
    env:
      DATABASE_URL: postgresql://practice:practice@localhost:5432/practice?schema=public
      AUTH_SECRET: ci-auth-secret-with-at-least-thirty-two-characters
      COOKIE_SECURE: "true"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm run db:generate
      - run: npm test
      - run: npx prisma migrate deploy
        env:
          DATABASE_URL: postgresql://practice:practice@localhost:5432/practice?schema=ci_integration
      - run: npm run test:integration
        env:
          DATABASE_URL: postgresql://practice:practice@localhost:5432/practice?schema=ci_integration
      - run: npm run lint
      - run: npm run build
      - run: npx playwright install --with-deps chromium
      - run: npx prisma migrate deploy
        env:
          DATABASE_URL: postgresql://practice:practice@localhost:5432/practice?schema=ci_e2e
      - run: npm run db:seed
        env:
          DATABASE_URL: postgresql://practice:practice@localhost:5432/practice?schema=ci_e2e
      - run: npm run test:e2e
        env:
          DATABASE_URL: postgresql://practice:practice@localhost:5432/practice?schema=ci_e2e
