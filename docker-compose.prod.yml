services:
  db:
    image: mysql:8.0.46
    restart: unless-stopped
    command: ["--character-set-server=utf8mb4", "--collation-server=utf8mb4_0900_ai_ci"]
    environment:
      MYSQL_DATABASE: practice
      MYSQL_USER: practice
      MYSQL_PASSWORD: ${MYSQL_PASSWORD}
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD}
    volumes:
      - practice-mysql:/var/lib/mysql
    networks:
      - backend
    healthcheck:
      test: ["CMD-SHELL", "mysqladmin ping -h 127.0.0.1 -u root -p$$MYSQL_ROOT_PASSWORD --silent"]
      interval: 5s
      timeout: 5s
      retries: 30

  lan-config:
    build:
      context: .
      target: builder
    environment:
      APP_BIND_IP: ${APP_BIND_IP:?APP_BIND_IP must be set}
      APP_ALLOWED_CIDRS: ${APP_ALLOWED_CIDRS:?APP_ALLOWED_CIDRS must be set}
    command: ["npx", "tsx", "scripts/validate-lan-config.ts"]
    network_mode: none
    restart: "no"

  migrate:
    build:
      context: .
      target: builder
    environment:
      DATABASE_URL: ${DATABASE_URL}
    command: ["npx", "prisma", "migrate", "deploy"]
    depends_on:
      db:
        condition: service_healthy
      lan-config:
        condition: service_completed_successfully
    networks:
      - backend
    restart: "no"

  app:
    build:
      context: .
      target: runner
    restart: unless-stopped
    environment:
      DATABASE_URL: ${DATABASE_URL}
      AUTH_SECRET: ${AUTH_SECRET}
      STUDENT_DATA_ENCRYPTION_KEY: ${STUDENT_DATA_ENCRYPTION_KEY}
      STUDENT_DATA_HASH_KEY: ${STUDENT_DATA_HASH_KEY}
      COOKIE_SECURE: "true"
      NODE_ENV: production
    depends_on:
      migrate:
        condition: service_completed_successfully
    networks:
      - frontend
      - backend
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:3000/api/health/ready').then(r=>{if(!r.ok)process.exit(1)}).catch(()=>process.exit(1))"]
      interval: 15s
      timeout: 5s
      retries: 10

  exam-settlement-worker:
    build:
      context: .
      target: builder
    restart: unless-stopped
    environment:
      DATABASE_URL: ${DATABASE_URL}
      NODE_ENV: production
    command: ["npx", "tsx", "scripts/exam-settlement-worker.ts"]
    depends_on:
      migrate:
        condition: service_completed_successfully
    networks:
      - backend
  proxy:
    image: public.ecr.aws/docker/library/caddy:2-alpine
    restart: unless-stopped
    environment:
      APP_BIND_IP: ${APP_BIND_IP:?APP_BIND_IP must be set}
      APP_ALLOWED_CIDRS: ${APP_ALLOWED_CIDRS:?APP_ALLOWED_CIDRS must be set}
    ports:
      - "${APP_BIND_IP:?APP_BIND_IP must be set}:80:80"
      - "${APP_BIND_IP:?APP_BIND_IP must be set}:443:443"
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy-data:/data
      - caddy-config:/config
    depends_on:
      app:
        condition: service_healthy
    networks:
      - frontend

volumes:
  practice-mysql:
  caddy-data:
  caddy-config:

networks:
  frontend:
    driver: bridge
  backend:
    driver: bridge
    internal: true
