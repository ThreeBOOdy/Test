services:
  db:
    image: public.ecr.aws/docker/library/postgres:18-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: practice
      POSTGRES_USER: practice
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
    volumes:
      - practice-db:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U practice -d practice"]
      interval: 5s
      timeout: 5s
      retries: 20

  migrate:
    build:
      context: .
      target: builder
    environment:
      DATABASE_URL: postgresql://practice:${POSTGRES_PASSWORD}@db:5432/practice?schema=public
    command: ["npx", "prisma", "migrate", "deploy"]
    depends_on:
      db:
        condition: service_healthy
    restart: "no"

  app:
    build:
      context: .
      target: runner
    restart: unless-stopped
    environment:
      DATABASE_URL: postgresql://practice:${POSTGRES_PASSWORD}@db:5432/practice?schema=public
      AUTH_SECRET: ${AUTH_SECRET}
      COOKIE_SECURE: "true"
      NODE_ENV: production
    depends_on:
      migrate:
        condition: service_completed_successfully
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:3000/api/health/ready').then(r=>{if(!r.ok)process.exit(1)}).catch(()=>process.exit(1))"]
      interval: 15s
      timeout: 5s
      retries: 10

  proxy:
    image: public.ecr.aws/docker/library/caddy:2-alpine
    restart: unless-stopped
    environment:
      APP_DOMAIN: ${APP_DOMAIN}
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy-data:/data
      - caddy-config:/config
    depends_on:
      app:
        condition: service_healthy

volumes:
  practice-db:
  caddy-data:
  caddy-config:
